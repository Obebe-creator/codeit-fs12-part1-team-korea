<!doctype html>
<html lang="ko">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="stylesheet" href="../css/reset.css" />
	<link rel="stylesheet" href="../css/jeolla/2026_events.css" />
	<title>2026 축제 일정</title>
</head>

<body>
	<!-- ================= MAIN ================= -->
	<main>
		<section>
			<div class="container">
				<div class="calendarArea">

					<h1 class="calendarHead">전라도 2026 축제 일정</h1>
					<span class="year">2026</span>
					<span class="month">03</span>

					<table id="calendar">
						<thead>
							<tr>
								<th class="holiday">일</th>
								<th>월</th>
								<th>화</th>
								<th>수</th>
								<th>목</th>
								<th>금</th>
								<th>토</th>
							</tr>
						</thead>

						<tbody>
							<!-- 1주 -->
							<tr>
								<td class="holiday">1</td>
								<td>2</td>
								<td>3</td>
								<td>4</td>
								<td>5</td>
								<td>6</td>
								<td>7</td>
							</tr>

							<!-- 2주 -->
							<tr>
								<td class="holiday">8</td>
								<td>9</td>
								<td>10</td>
								<td>11</td>
								<td>12</td>
								<td>13</td>
								<td>14</td>
							</tr>

							<!-- 3주 -->
							<tr>
								<td class="holiday">15</td>
								<td>16</td>
								<td>17</td>
								<td>18</td>
								<td>19</td>
								<td>20</td>
								<td>21</td>
							</tr>

							<!-- 4주 -->
							<tr>
								<td class="holiday">22</td>
								<td>23</td>
								<td>24</td>
								<td>25</td>
								<td>26</td>
								<td>27</td>
								<td>28</td>
							</tr>

							<!-- 5주 -->
							<tr>
								<td class="holiday">29</td>
								<td>30</td>
								<td>31</td>
								<td class="nextMonth">1</td>
								<td class="nextMonth">2</td>
								<td class="nextMonth">3</td>
								<td class="nextMonth">4</td>
							</tr>
						</tbody>
					</table>

				</div>
			</div>
		</section>
	</main>

</body>

</html>
