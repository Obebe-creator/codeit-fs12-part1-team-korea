<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            padding-top: 100px;
            background: #f5f5f5;
        }

        .calendar {
            width: 80vw;
            height: 135vh;
            background: white;
            padding: 20px;
            border-radius: 12px;
        }

        h2 {
            text-align: center;
            margin-bottom: 50px;
        }
        table {
            width: 100%;
        }
        
        td {
            width: 10vw;
            padding: 10px;
            vertical-align: top;
            height: 20vh;
        }

        td:hover {
            background: #e3f2fd;
            cursor: pointer;
        }

        .sun { color: #d32f2f; }
        .sat { color: #1976d2; }
    </style>
</head>

                <th>화</th>
                <th>수</th>
                <th>목</th>
                <th>금</th>
                <th class="sat">토</th>
            </tr>
            <tr>
                <td class="sun">1<br>서울<br>1919 서대문, 그날의 함성(끝)</td>
                <td>2<br>양평<br>양평빙송어축제(끝)</td>

                <td class="sun">22<br>양평<br>양평 단월 고로쇠축제(끝)</td>

</body>
</html>
