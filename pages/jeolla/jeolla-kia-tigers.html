<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<title>KIA Tigers 소개</title>
	<link rel="stylesheet" href="../../css/reset.css">
	<link rel="stylesheet" href="../../css/jeolla/jeolla.css">
	<link rel="stylesheet" href="../../css/jeolla/kia-tigers.css">
</head>

<body>
	<div class="jeollaHomeText">
		<a href="jeolla_index.html">전라도</a>
	</div>

	<main class="kia">
		<!-- 본문 -->
		<section class="kia__layout">

			<!-- LEFT -->
			<aside class="kia__logo-area">
				<div class="kia__logo-wrapper">
					<div class="kia__logo-box">
						<img src="../../assets/images/kia_tigers_logo.png" alt="KIA 타이거즈 로고">
					</div>

					<div class="kia_trophy">
						<img src="../../assets/images/kia_trophy.jpg" alt="KIA 우승 트로피">
					</div>
				</div>
			</aside>

			<!-- RIGHT -->
			<section class="kia__content">

				<h1 class="kia__stadium">
					광주-KIA 챔피언스 필드
					<a href="https://map.naver.com/v5/search/광주%20KIA%20챔피언스%20필드" target="_blank"
						rel="noopener noreferrer" class="kia__map-link">
						<span class="map-icon">📍</span>
					</a>
				</h1>

				<article class="kia__card">
					<ul class="kia__info">
						<li>"압도하라 KIA TIGERS - 광주광역시를 연고로 하는 명문 프로야구 팀"</li>
						<li>2024 프로야구 통합 우승 및 역대 최다 우승(12회), 한국시리즈 무패의 전설</li>
						<li>구장 내 카페 시설 보유 - INK COFFEE</li>
						<li>전국 최다 팬 보유 명성에 걸맞는 응원 소리, 함께 즐기는 한국 야구 문화 체험</li>
						<li>선동렬(18), 이종범(7) 등 수많은 레전드 배출</li>
						<li>자랑할 것이 너무 많은 관계로 이하 생략</li>
					</ul>
				</article>

			</section>

		</section>

	</main>

</body>

</html>
